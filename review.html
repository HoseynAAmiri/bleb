<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscript review</title>
<!-- KaTeX renders math in the paragraph and in chat replies; without network both just show raw $...$. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<link rel="stylesheet" href="/bleb/bleb.css">
<style>
  :root { --bg:#ebe5d6; --fg:#35322b; --dim:#6a6457; --line:#d6cdba; --card:#f3eee1; --accent:#2c6a59; --ins:#1d5fa8; --del:#b3372b; }
  /* Dark: follows the system unless the toggle has set data-theme. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg:#25272c; --fg:#c8c4b9; --dim:#989a9e; --line:#3b3e45; --card:#2d3036; --accent:#7fb8a6; --ins:#8ab8f0; --del:#e08a80; }
  }
  :root[data-theme=dark] { --bg:#25272c; --fg:#c8c4b9; --dim:#989a9e; --line:#3b3e45; --card:#2d3036; --accent:#7fb8a6; --ins:#8ab8f0; --del:#e08a80; }
  mark { background:rgba(255, 210, 0, .35); color:inherit; }
  /* Track changes: text you added, and text you removed (shown but not part of the source). */
  #preview ins { color:var(--ins); text-decoration:none; font-family:system-ui, sans-serif; font-size:.92em; }
  #preview del { color:var(--del); text-decoration:line-through; opacity:.85; }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  html { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:baseline; gap:12px; }
  #section { flex:1; font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #section span { color:var(--dim); font-weight:400; }
  #count { font-variant-numeric:tabular-nums; font-weight:600; }
  #count input { width:3.5em; font:inherit; color:inherit; background:none; border:0;
    border-bottom:1px dashed var(--dim); text-align:right; padding:0; }
  #bar { height:4px; background:var(--line); border-radius:2px; margin:10px 0 6px; }
  #progress { margin-bottom:18px; font-size:12px; color:var(--dim); cursor:pointer; }
  /* Switches: a pill with a sliding thumb, and its label. */
  .switch { gap:8px; font-size:13px; color:var(--dim); }
  .switch i { width:32px; height:18px; padding:2px; border-radius:99px; background:var(--line); transition:background .15s; }
  .switch i::before { content:''; display:block; width:14px; height:14px; border-radius:50%; background:var(--card);
    box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .switch[aria-checked=true] { color:var(--fg); }
  .switch[aria-checked=true] i { background:var(--accent); }
  .switch[aria-checked=true] i::before { transform:translateX(14px); }
  #toc a.done small { color:var(--accent); opacity:1; font-weight:700; }
  #toc a.here.done small { color:inherit; }
  #bar div { height:100%; background:var(--accent); border-radius:2px; transition:width .2s; }
  #preview { font:19px/1.65 Georgia, 'Times New Roman', serif; margin:0 -12px 14px; padding:10px 12px;
    border-radius:8px; overflow-wrap:break-word; outline:none; caret-color:var(--accent); }
  /* Drawn caret: thicker than the browser's, which is hidden while this one is showing. */
  #caret { position:absolute; width:3px; border-radius:2px; background:var(--accent); pointer-events:none;
    animation:caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity:0; } }
  #preview[contenteditable=true]:focus { background:var(--card); box-shadow:0 0 0 1px var(--line); }
  #preview.raw:focus { box-shadow:none; outline:2px solid var(--accent); outline-offset:-1px; }
  #preview .cite { color:var(--dim); font-size:.75em; }
  #preview .math, #preview .src { font-family:ui-monospace, monospace; font-size:.8em; color:var(--accent); }
  #preview .tex { cursor:pointer; }
  #preview .katex { font-size:1em; }
  textarea { width:100%; min-height:120px; resize:vertical; padding:12px; border:1px solid var(--line);
    border-radius:8px; background:var(--card); color:var(--fg); font:13.5px/1.55 ui-monospace, Menlo, monospace; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  footer { display:flex; align-items:center; gap:10px; margin-top:14px; }
  #status { flex:1; color:var(--dim); font-size:13px; }
  /* Buttons are ghosts: an icon, no frame, a tint on hover. The name is the tooltip (aria-label). */
  button { position:relative; display:inline-flex; align-items:center; font:inherit; padding:7px; border-radius:8px; border:0;
    background:none; color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled) { background:color-mix(in srgb, var(--fg) 9%, transparent); }
  button.primary { color:var(--accent); }
  svg.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  button[aria-label]::after { content:attr(aria-label); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    padding:3px 8px; border-radius:6px; background:var(--fg); color:var(--bg); font:500 12px/1.4 system-ui, sans-serif;
    white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .12s; z-index:5; }
  button[aria-label]:hover::after, button[aria-label]:focus-visible::after { opacity:1; transition-delay:.35s; }
  #next::after, #send::after { left:auto; right:0; transform:none; }  /* at the right edge: grow leftwards */
  button:disabled { opacity:.4; cursor:default; }
  .hint { color:var(--dim); font-size:12px; margin-top:18px; }

  /* Right column: outline on top, chat below. On wide windows the outline moves left of the text. */
  #side { position:fixed; top:16px; bottom:16px; right:max(16px, calc(50% - 804px)); width:400px;
    display:flex; flex-direction:column; justify-content:center; gap:12px; padding-top:78px; }
  #toc { flex:none; max-height:50%; overflow-y:auto; padding:8px; font-size:12.5px; line-height:1.3; background:var(--card);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  #toc a { display:flex; gap:8px; padding:3px 8px; border-radius:6px; color:var(--dim); cursor:pointer; }
  #toc a:hover { color:var(--fg); }
  #toc a.on { color:var(--fg); font-weight:600; }
  #toc a.here { background:var(--accent); color:var(--bg); }
  #toc a b { flex:1; font-weight:inherit; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #toc a small { font-variant-numeric:tabular-nums; opacity:.7; font-weight:400; }
  aside { flex:0 1 720px; min-height:0;
    display:flex; flex-direction:column; gap:10px; padding:14px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  aside h2 { margin:0; font-size:14px; display:flex; gap:8px; align-items:baseline; }
  #theme { align-self:center; cursor:pointer; }
  #theme::before { content:''; display:block; width:14px; height:14px; border-radius:50%;
    border:1.5px solid currentColor; background:linear-gradient(90deg, currentColor 50%, transparent 50%); }
  #clear { align-self:center; display:flex; padding:2px 4px; border:0; background:none; color:var(--dim); cursor:pointer; }
  #clear:hover, #gear:hover { color:var(--fg); }
  #gear, #theme { padding:0 4px; border:0; background:none; font-size:16px; color:var(--dim); }
  #settings { display:grid; gap:6px; font-size:12px; color:var(--dim); }
  #settings[hidden] { display:none; }
  #settings input { width:100%; padding:5px 8px; font:13px ui-monospace, monospace; color:var(--fg);
    background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  #ctx { flex:1; white-space:nowrap; text-align:right; color:var(--dim); font-size:11px; font-weight:400; }
  #log { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; font-size:14px; }
  .msg { padding:8px 10px; border-radius:8px; white-space:pre-wrap; overflow-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:var(--bg); max-width:90%; }
  .msg.bot { background:var(--bg); border:1px solid var(--line); user-select:text; }
  .msg code, .msg pre { font:12px/1.5 ui-monospace, Menlo, monospace; background:var(--card); border-radius:4px; }
  .msg code { padding:1px 4px; }
  .msg pre { margin:6px 0; padding:8px; border:1px solid var(--line); white-space:pre-wrap; }
  .msg .h { display:block; margin-top:4px; }
  .msg.err { color:#c0392b; }
  #sel { font-size:12px; color:var(--dim); border-left:3px solid var(--accent); padding:2px 8px;
    max-height:4.6em; overflow:hidden; cursor:pointer; }
  #sel:empty { display:none; }
  #quick { display:flex; gap:6px; flex-wrap:wrap; }
  #quick button { padding:3px 10px; font-size:12px; border-radius:99px; border:1px solid var(--line); }
  #askbox { position:relative; flex-shrink:0; display:flex; }
  #ask { min-height:64px; max-height:200px; resize:none; padding-right:52px; font:14px/1.4 system-ui, sans-serif; }
  #send, #send:hover:not(:disabled) { position:absolute; right:8px; bottom:8px; background:var(--accent); color:var(--bg); }
  #send:hover { filter:brightness(1.12); }
  /* Keep the paragraph centred when there is room; otherwise make room for the panel. */
  @media (max-width:1620px) { body { padding-right:432px; } }
  @media (min-width:1621px) {
    #toc { position:fixed; top:50%; transform:translateY(-50%); left:calc(50% - 644px); width:240px; max-height:min(80vh, calc(100vh - 190px)); }
    #side { padding-top:0; }
  }
  @media (max-width:900px) {
    body { padding-right:0; }
    #side { position:static; width:auto; margin:0 16px 24px; padding-top:0; }
    aside { flex:none; height:70vh; }
  }
</style>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('reviewTheme') || ''; } catch {}
</script>
<main>
  <header>
    <span id="section"></span>
    <span id="count"><input id="jump" inputmode="numeric"> / <span id="total"></span></span>
    <button id="theme" title="Switch light / dark"></button>
  </header>
  <div id="bar"><div></div></div>
  <div id="progress" title="Go to the first paragraph not yet reviewed"></div>
  <div id="preview" spellcheck="true" contenteditable="true"></div>
  <footer>
    <button id="mark" class="switch" role="switch" title="Toggle the reviewed mark for this paragraph"><i></i>Reviewed</button>
    <button id="track" class="switch" role="switch" title="Show or hide your edits to this paragraph (added text coloured, removed text struck through)"><i></i>Edits</button>
    <span id="status"></span>
    <button id="save" aria-label="Save and rebuild PDF · Ctrl+S"><svg class="ico" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/></svg></button>
    <button id="prev" aria-label="Back · Alt+←"><svg class="ico" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg></button>
    <button id="next" class="primary" aria-label="Mark reviewed and next · Ctrl+Enter"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </footer>
  <div class="hint">Ctrl+S: save and rebuild PDF &nbsp;·&nbsp; Ctrl+Enter: save, mark reviewed, next &nbsp;·&nbsp; Alt+←/→: move without marking &nbsp;&nbsp</div>
</main>
<div id="side">
<nav id="toc"></nav>
<aside>
  <h2>Ask about this paragraph <span id="ctx" title="How much of the manuscript fits in the model's context window and is sent with each question. If it is not the full manuscript, the model gets the abstract plus the paragraphs nearest this one. Load the model with a larger context length, or set Context tokens in settings, to send more."></span><button id="clear" title="Clear chat: forget this conversation and start a new one"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.6 6.5v4.5M9.4 6.5v4.5"/></svg></button><button id="gear" title="Model settings">⚙</button></h2>
  <div id="settings" hidden>
    <label>Base URL (OpenAI-compatible)<input id="set-url" placeholder="__LLM__"></label>
    <label>Model<input id="set-model" placeholder="__MODEL__"></label>
    <label>API key (blank if none)<input id="set-key" type="password" autocomplete="off"></label>
    <label>Context tokens (blank = ask LM Studio, else 8192)<input id="set-ctx" inputmode="numeric"></label>
  </div>
  <div id="log"></div>
  <div id="sel" title="Click to drop the highlight"></div>
  <div id="quick">
    <button data-q="Explain what this says and what job it does in the paper.">Explain</button>
    <button data-q="Rephrase this so it reads more clearly. Keep the meaning.">Rephrase</button>
    <button data-q="Make this shorter without losing content.">Shorten</button>
    <button data-q="What is weak or unclear here? Give specific fixes.">Critique</button>
  </div>
  <div id="askbox"><textarea id="ask" placeholder="Highlight text on the left, then ask. Enter to send."></textarea>
    <button id="send" aria-label="Send · Enter"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 21.7a.5.5 0 0 0 .9 0l6.5-19a.5.5 0 0 0-.6-.6l-19 6.5a.5.5 0 0 0 0 .9l7.9 3.2a2 2 0 0 1 1.1 1.1zM21.9 2.1 10.9 13.1"/></svg></button></div>
</aside>
</div>
<script type="module">
import { createBleb } from '/bleb/bleb.js';
const bleb = createBleb({ storageKey: 'reviewJelly', getReadingTarget: () => {
  const el=document.getElementById('preview');
  return {text:el.innerText, rect:el.getBoundingClientRect()};
}, getHome: () => {
  const r = document.getElementById('toc').getBoundingClientRect();
  return {x: r.left < innerWidth/2 ? r.left+(r.width-76)/2 : r.left+20, y:r.top-74};
}});
document.getElementById('preview').addEventListener('input', () => bleb.edited());

const $ = id => document.getElementById(id);
let chunks = [], i = 0, draft = '';  // draft: the paragraph's LaTeX as currently edited

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// The paragraph has two views. Typeset (when you are not editing): citations and math are atomic
// chips, \emph{..} etc. are tags that remember their command, and tex() turns the HTML back into
// the exact source. Raw (while you are editing it): the plain LaTeX source, nothing parsed.
// A click puts the caret in the typeset text, which you can edit in place; a double-click
// switches to raw, and clicking elsewhere switches back.
// Math also stays raw without KaTeX or where KaTeX cannot parse it. Typeset math is set aside
// so the later rules never touch it.
const TAG = { paragraph: 'b', emph: 'i', textit: 'i', hl: 'mark' };
let raw = false;
function pretty(src) {
  // Editing view: the text keeps its font, the LaTeX in it (math, \cite{..}, command names) is set apart.
  if (raw) return esc(src).replace(/(?<!\\)\$[^$]+\$|\\(?:cite|ref|label)\{[^}]*\}|\\[a-zA-Z]+/g, '<span class="src">$&</span>');
  const math = [];
  return esc(src)
    .replace(/(?<!\\)\$[^$]+\$/g, m => {
      const body = m.slice(1, -1).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
      let html;
      try { html = katex.renderToString(body); } catch { return `<span class="math">${m}</span>`; }  // no KaTeX, or it cannot parse this
      math.push(`<span class="tex" contenteditable="false" data-tex="${m.replace(/"/g, '&quot;')}">${html}</span>`);
      return '\x01' + (math.length - 1) + '\x01';
    })
    .replace(/\\%|%/g, m => m === '%' ? '<span class="src" contenteditable="false" data-tex="%">%</span>' : '%')  // a bare % is a comment: keep it as is
    .replace(/\s*\\cite\{([^}]*)\}/g, (m, k) =>
      `<span class="cite" contenteditable="false" data-tex="${m.replace(/"/g, '&quot;')}"> [${k.split(',').length} ref]</span>`)
    .replace(/\\(paragraph|emph|textit|hl)\{([^{}]*)\}/g, (m, cmd, body) => `<${TAG[cmd]} data-cmd="${cmd}">${body}</${TAG[cmd]}>`)
    .replace(/\x01(\d+)\x01/g, (_, k) => math[k]);
}

// Source of a run of text: in the typeset view a % stands for \% (also when typed as \%).
const unpretty = t => raw ? t : t.replace(/\\?%/g, '\\%');
function tex(node) {
  let s = '';
  for (const n of node.childNodes) {
    if (n.nodeType === 3) s += unpretty(n.nodeValue).replace(/ /g, ' ');
    else if (n.nodeType !== 1 || n.tagName === 'BR') continue;
    else if (n.dataset.tex != null) s += n.dataset.tex;
    else if (n.dataset.cmd) s += `\\${n.dataset.cmd}{${tex(n)}}`;
    else s += tex(n);
  }
  return s;
}

function show() {
  i = Math.max(0, Math.min(i, chunks.length - 1));
  try { localStorage.setItem('reviewIndex', i); } catch {}
  const c = chunks[i];
  const path = c.section.split(' › ');  // parents dim, current heading bold
  $('section').innerHTML = path.map((t, k) => k < path.length - 1 ? `<span>${esc(t)} › </span>` : esc(t)).join('');
  $('jump').value = i + 1;
  $('total').textContent = chunks.length;
  const nDone = chunks.filter(x => x.reviewed).length;
  $('bar').firstElementChild.style.width = nDone / chunks.length * 100 + '%';
  bleb.progress(nDone, chunks.length);
  $('progress').textContent = `${nDone} of ${chunks.length} reviewed` + (nDone < chunks.length ? ' · unreviewed' : '');
  $('mark').ariaChecked = !!c.reviewed;
  draft = c.text;
  caret = 0; raw = false;
  undo = []; redo = []; last = { text: c.text, at: 0 };
  $('prev').disabled = i === 0;
  render();
  outline();
  window.scrollTo(0, 0);
  if (shown !== c.text) { shown = c.text; resetChat(); }
}

// Outline of every section and subsection, with reviewed/total paragraph counts; click to jump.
function outline() {
  const first = new Map(), count = new Map(), done = new Map();
  chunks.forEach((c, k) => {
    const p = c.section.split(' › ');
    p.forEach((_, d) => {
      const key = p.slice(0, d + 1).join(' › ');
      if (!first.has(key)) first.set(key, k);
      count.set(key, (count.get(key) || 0) + 1);
      if (c.reviewed) done.set(key, (done.get(key) || 0) + 1);
    });
  });
  const here = chunks[i].section;
  $('toc').innerHTML = [...first].map(([key, k]) => {
    const p = key.split(' › ');
    const cls = here === key ? 'on here' : here.startsWith(key + ' › ') ? 'on' : '';
    const all = done.get(key) === count.get(key);
    const n = all ? '✓' : `${done.get(key) || 0}/${count.get(key)}`;
    return `<a data-k="${k}" class="${cls}${all ? ' done' : ''}" style="margin-left:${(p.length - 1) * 14}px"><b>${esc(p.at(-1))}</b><small>${n}</small></a>`;
  }).join('');
}
$('toc').onclick = e => { const a = e.target.closest('a'); if (a) go(+a.dataset.k); };

// Word-level diff of two texts as [['=' | '+' | '-', text], ...]. Whitespace differences are
// ignored when comparing, and the '=' and '+' pieces join back to exactly `b`. A $...$ formula
// is one word, so no piece ever holds half of one.
function diff(a, b) {
  const words = /^\s+|(?:\$[^$]+\$|\S)+\s*/g;
  const A = a.match(words) || [], B = b.match(words) || [];
  const same = (x, y) => A[x].trim() === B[y].trim();
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let x = n - 1; x >= 0; x--) for (let y = m - 1; y >= 0; y--)
    L[x][y] = same(x, y) ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
  const out = [];
  const push = (t, s) => { if (out.at(-1)?.[0] === t) out.at(-1)[1] += s; else out.push([t, s]); };
  for (let x = 0, y = 0; x < n || y < m;) {
    if (x < n && y < m && same(x, y)) { push('=', B[y]); x++; y++; }
    else if (x < n && (y === m || L[x + 1][y] >= L[x][y + 1])) push('-', A[x++]);
    else push('+', B[y++]);
  }
  return out;
}

// Track changes are drawn inside the editor. Removed text is a non-editable chip that
// contributes nothing to the source, so tex() still returns exactly the current text.
let track = true;
try { track = localStorage.getItem('reviewTrack') !== 'off'; } catch {}
function draw() {
  const P = $('preview'), cur = draft, base = chunks[i].original ?? chunks[i].text;
  P.innerHTML = pretty(cur);
  P.classList.toggle('raw', raw);
  $('track').ariaChecked = track;
  if (!track || base === cur) return;
  const plain = P.innerHTML;
  P.innerHTML = diff(base, cur).map(([t, s]) =>
    t === '-' ? `<del contenteditable="false" data-tex="">${esc(s)}</del>` : t === '+' ? `<ins>${pretty(s)}</ins>` : pretty(s)).join('');
  if (tex(P) !== cur) P.innerHTML = plain;  // never show a view that would save differently
}
// Redrawing removes the text the caret sat in, which browsers do not always report as a selection change.
function render() { draw(); drawCaret(); }
$('track').onclick = () => {
  track = !track;
  try { localStorage.setItem('reviewTrack', track ? 'on' : 'off'); } catch {}
  render();
};

// Put the caret back at a source offset after the view is redrawn (mirrors tex()).
function placeCaret(node, off) {
  for (const n of node.childNodes) {
    if (n.nodeType === 3) {
      const len = unpretty(n.nodeValue).length;
      if (off <= len) {
        const at = Math.max(off, 0);
        for (off = 0; unpretty(n.nodeValue.slice(0, off)).length < at; off++);  // source offset to offset in the shown text
        // A space just typed before the caret would collapse and be dropped by the browser on the
        // next keystroke; hold it as a non-breaking space, which tex() turns back into a space.
        if (n.nodeValue[off - 1] === ' ') n.nodeValue = n.nodeValue.slice(0, off - 1) + '\u00a0' + n.nodeValue.slice(off);
        getSelection().collapse(n, off);
        return -1;
      }
      off -= len;
    } else if (n.nodeType !== 1 || n.tagName === 'BR') continue;
    else if (n.dataset.tex != null) off -= n.dataset.tex.length;
    else {
      if (n.dataset.cmd) off -= n.dataset.cmd.length + 2;
      if ((off = placeCaret(n, off)) < 0) return -1;
      if (n.dataset.cmd) off -= 1;
    }
  }
  return off;
}

// Save the current chunk if edited. Returns false if the file changed on disk.
async function save() {
  const text = draft, was = chunks[i].reviewed;
  if (text === chunks[i].text) return true;
  const r = await fetch('/save', { method: 'POST', body: JSON.stringify({ i, old: chunks[i].text, new: text }) });
  chunks = await r.json();
  if (!r.ok) {
    $('status').textContent = 'File changed on disk. Reloaded; your edit was not saved.';
    show();
    return false;
  }
  $('status').textContent = 'Saved ' + new Date().toLocaleTimeString();
  if (was && chunks[i]?.text === text) await mark(true);  // editing a reviewed paragraph keeps it reviewed
  return true;
}

async function go(to) { if (await save()) { i = to; show(); } }

// Reviewed marks are stored by the server next to the .tex file, keyed to the paragraph's exact text.
async function mark(on) {
  const r = await fetch('/mark', { method: 'POST', body: JSON.stringify({ text: chunks[i].text, on }) });
  chunks = await r.json();
}
async function reviewedNext() { if (await save()) { await mark(true); i++; show(); } }
$('mark').onclick = async () => {
  if (!(await save())) return;
  await mark(!chunks[i].reviewed);
  shown = chunks[i].text;  // same paragraph: keep the chat
  show();
};
$('progress').onclick = () => { const k = chunks.findIndex(c => !c.reviewed); if (k >= 0) go(k); };

// Caret position as an offset into the LaTeX source of this paragraph.
let caret = 0;
// A point in the paragraph as an offset into its LaTeX source.
function srcOff(node, offset) {
  const P = $('preview'), r = document.createRange();
  r.setStart(P, 0); r.setEnd(node, offset);
  let off = tex(r.cloneContents()).length;
  // The clone closes any \emph{..} the point sits inside; don't count those closing braces.
  for (let n = node; n !== P; n = n.parentNode) if (n.dataset?.cmd) off--;
  return off;
}
function previewCaret() {
  const g = getSelection();
  return g.rangeCount && $('preview').contains(g.focusNode) ? srcOff(g.focusNode, g.focusOffset) : null;
}
const CARET = document.body.appendChild(Object.assign(document.createElement('div'), { id: 'caret' }));
function drawCaret() {
  const g = getSelection(), P = $('preview');
  const r = g.rangeCount && g.isCollapsed && P.contains(g.focusNode) && g.getRangeAt(0).getClientRects()[0];
  CARET.hidden = !r;
  P.style.caretColor = r ? 'transparent' : '';
  if (!r) return;
  CARET.style.cssText = `left:${r.left + scrollX - 1}px; top:${r.top + scrollY - 2}px; height:${r.height + 4}px`;
  CARET.getAnimations().forEach(a => a.currentTime = 0);  // solid while it moves
}
document.addEventListener('selectionchange', () => {
  caret = previewCaret() ?? caret;
  drawCaret();
});
addEventListener('resize', drawCaret);

// Save in place, then rebuild the PDF so the LaTeX Workshop viewer shows it at the caret.
let building = false;
async function saveAndBuild() {
  if (building || !(await save())) return;
  if (draft === chunks[i].text) {
    shown = chunks[i].text;  // same paragraph: keep the chat
    // Redraw so the edit just saved shows as a tracked change, keeping the caret where it was.
    const typing = document.activeElement === $('preview'), at = caret;
    render();
    if (typing) placeCaret($('preview'), at);
  } else show();  // the edit split or merged paragraphs
  building = true; $('save').disabled = true;
  const saved = 'Saved ' + new Date().toLocaleTimeString();
  $('status').textContent = saved + ' · building PDF…';
  try {
    const r = await (await fetch('/build', { method: 'POST', body: JSON.stringify({ i, offset: caret }) })).json();
    $('status').textContent = saved + (!r.ok ? ' · build failed: ' + r.log : r.pointed ? ' · PDF updated' : ' · PDF updated (viewer not reached)');
  } catch (e) { $('status').textContent = saved + ' · build failed: ' + e.message; }
  building = false; $('save').disabled = false;
}
$('save').onclick = saveAndBuild;
const dirty = () => { if (draft !== chunks[i].text) $('status').textContent = 'Unsaved changes'; };

$('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('reviewTheme', root.dataset.theme); } catch {}
};
$('next').onclick = reviewedNext;
$('prev').onclick = () => go(i - 1);
$('jump').onchange = e => go((parseInt(e.target.value) || 1) - 1);
// Switch the paragraph to its raw LaTeX with the selection at source offsets a..b.
function enterRaw(a, b = a) {
  const P = $('preview'), g = getSelection();
  raw = true; render();
  P.focus(); placeCaret(P, a);
  if (b === a) return;
  const node = g.focusNode, off = g.focusOffset;
  placeCaret(P, b); g.setBaseAndExtent(node, off, g.focusNode, g.focusOffset);
}
// A double-click opens the source at the point of the first click; on a formula or citation, inside it.
$('preview').addEventListener('mousedown', e => {
  if (raw || e.detail !== 2) return;
  e.preventDefault();  // keep the caret from the first click instead of selecting the word
  const chip = e.target.closest('.tex, .cite');
  if (!chip) return enterRaw(previewCaret() ?? caret);
  const start = srcOff(chip.parentNode, [...chip.parentNode.childNodes].indexOf(chip)), t = chip.dataset.tex;
  enterRaw(start + (chip.matches('.cite') ? t.indexOf('{') : 0) + 1);
});
// The typeset text is edited in place. An edit that would hit a formula or citation opens the source instead.
$('preview').addEventListener('beforeinput', e => {
  if (raw) return;
  const chips = [...$('preview').querySelectorAll('.tex, .cite')], R = document.createRange();
  if (!e.getTargetRanges().some(r => (R.setStart(r.startContainer, r.startOffset), R.setEnd(r.endContainer, r.endOffset), chips.some(c => R.intersectsNode(c))))) return;
  e.preventDefault();
  const g = getSelection();
  enterRaw(srcOff(g.anchorNode, g.anchorOffset), srcOff(g.focusNode, g.focusOffset));
});
$('preview').addEventListener('blur', () => { if (raw) { raw = false; render(); } });
// Typing in the paragraph. With tracked changes on, the view is redrawn after every
// keystroke so new edits are marked as you type, and the caret is put back. Redrawing
// wipes the browser's own undo history, so undo/redo for the paragraph is kept here.
let undo = [], redo = [], last = { text: '', at: 0 }, lastPush = 0;
function restore(state) {
  draft = state.text; last = state;
  render(); dirty();
  if (placeCaret($('preview'), state.at) >= 0) getSelection().selectAllChildren($('preview')), getSelection().collapseToEnd();
}
$('preview').oninput = e => {
  const P = $('preview'), text = tex(P);
  draft = text; dirty();
  if (!track || e.isComposing) return;
  const at = previewCaret() ?? text.length;
  if (Date.now() - lastPush > 700) { undo.push(last); redo = []; lastPush = Date.now(); }  // one undo step per burst of typing
  restore({ text, at });
};
$('preview').addEventListener('compositionend', () => $('preview').oninput({}));
// One chunk is one paragraph: no line breaks, and paste as plain text.
$('preview').onkeydown = e => {
  if (e.key === 'Enter' && !e.ctrlKey) e.preventDefault();
  const z = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z', y = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y';
  if (!track || !(z || y)) return;
  e.preventDefault();
  const [from, to] = y || e.shiftKey ? [redo, undo] : [undo, redo];
  if (from.length) { to.push(last); lastPush = 0; restore(from.pop()); }
};
$('preview').onpaste = e => {
  e.preventDefault();
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s*\n\s*/g, ' '));
};
document.onkeydown = e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); reviewedNext(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAndBuild(); }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); go(i - 1); }
};

// ---- chat ----
let shown = null, history = [], selected = '', abort = null;

// Model settings live in this browser only; blank fields fall back to the defaults in review.py.
const SETTINGS = ['url', 'model', 'key', 'ctx'];
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem('reviewModel')) || {}; } catch {}
for (const k of SETTINGS) {
  const el = $('set-' + k);
  el.value = cfg[k] || '';
  el.oninput = () => {
    cfg[k] = el.value.trim();
    try { localStorage.setItem('reviewModel', JSON.stringify(cfg)); } catch {}
  };
}
$('gear').onclick = () => { $('settings').hidden = !$('settings').hidden; };

// The model has no memory of its own: every question is sent with the whole
// conversation so far (history), so emptying history is what makes it forget.
function clearChat() {
  if (abort) abort.abort();
  history = [];
  $('log').innerHTML = '';
}
function resetChat() {
  clearChat();
  selected = ''; $('sel').textContent = '';
}
$('clear').onclick = clearChat;

// The highlight follows the selection in the paragraph, so deselecting clears it.
// It is kept while you work in the chat panel, since clicking there drops the selection.
let inChat = false;
document.addEventListener('pointerdown', e => { inChat = !!e.target.closest('aside'); }, true);
document.addEventListener('selectionchange', () => {
  if (inChat || document.activeElement.closest('aside')) return;
  const g = getSelection();
  let s = '';
  if (g.rangeCount && $('preview').contains(g.anchorNode)) s = tex(g.getRangeAt(0).cloneContents());  // source, since typeset math has no readable text
  selected = s.trim(); $('sel').textContent = selected;
});
$('sel').onclick = () => { selected = ''; $('sel').textContent = ''; };

// Small Markdown subset for model replies: code fences, inline code, bold, italic,
// math, headings and bullets. Line breaks come from the bubble's pre-wrap. Code is set
// aside first so LaTeX inside it is never touched (math outside code is typeset); an unclosed fence (mid-stream) still renders.
function md(src) {
  const code = [];
  const stash = html => '\x01' + (code.push(html) - 1) + '\x01';
  return esc(src)
    .replace(/```\w*\n?([\s\S]*?)(?:```|$)/g, (_, c) => stash(`<pre>${c.trimEnd()}</pre>`))
    .replace(/`([^`\n]+)`/g, (_, c) => stash(`<code>${c}</code>`))
    .replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+)\$/g, (m, block, inline) => {
      if (!window.katex) return stash(m);
      const src = (block ?? inline).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
      return stash(katex.renderToString(src, { displayMode: block != null, throwOnError: false }));
    })
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*)\*(?!\w)/gm, '$1<i>$2</i>')
    .replace(/^#{1,6}\s+(.*)$/gm, '<b class="h">$1</b>')
    .replace(/^(\s*)[-*]\s+/gm, '$1• ')
    .replace(/\x01(\d+)\x01/g, (_, k) => code[k]);
}

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('log').append(d); $('log').scrollTop = 1e9;
  return d;
}

async function ask(q) {
  if (abort) return abort.abort();
  q = q.trim();
  if (!q) return;
  $('ask').value = ''; grow();
  let content = `Section: ${chunks[i].section}\nParagraph on screen:\n<<<\n${draft}\n>>>\n`;
  if (selected) content += `Highlighted part:\n<<<\n${selected}\n>>>\n`;
  history.push({ role: 'user', content: content + '\n' + q });
  const thread = history;  // the conversation this question belongs to
  bubble('user', q);
  const out = bubble('bot', '…');
  abort = new AbortController(); $('send').textContent = 'Stop';
  let reply = '';
  try {
    const r = await fetch('/chat', { method: 'POST', body: JSON.stringify({ i, messages: history, ...cfg }), signal: abort.signal });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    $('ctx').textContent = r.headers.get('X-Context');
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    for (let buf = '';;) {
      const { value, done } = await reader.read();
      if (done) break;
      const lines = (buf + value).split('\n');
      buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data: ') || l.includes('[DONE]')) continue;
        reply += JSON.parse(l.slice(6)).choices?.[0]?.delta?.content || '';
        // Follow the stream only while the reader is at the bottom; scrolling up to reread stays put.
        const log = $('log'), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        out.innerHTML = md(reply);
        if (atBottom) log.scrollTop = 1e9;
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') { out.classList.add('err'); out.textContent = 'Model error: ' + e.message; }
  }
  // If the chat was cleared while this was streaming, `thread` is the old one and the reply is dropped with it.
  if (reply) thread.push({ role: 'assistant', content: reply }); else thread.pop();
  abort = null; $('send').textContent = 'Send';
}

// The composer grows with its text, up to its max-height.
const grow = () => { const a = $('ask'); a.style.height = 'auto'; a.style.height = a.scrollHeight + 2 + 'px'; };
$('ask').oninput = grow;
$('send').onclick = () => ask($('ask').value);
$('ask').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) { e.preventDefault(); ask($('ask').value); } };
$('quick').onclick = e => { if (e.target.dataset.q && !abort) ask(e.target.dataset.q); };

// KaTeX loads after this script; typeset the paragraph once it is there.
addEventListener('load', () => { if (chunks.length && window.katex) render(); });
fetch('/chunks').then(r => r.json()).then(c => {
  chunks = c;
  try { i = +localStorage.getItem('reviewIndex') || 0; } catch {}
  show();
});
</script>
